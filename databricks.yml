bundle:
  name: finance_bundle
  uuid: e8599de7-e987-40c2-a71a-d83a9c59d3a7


# ==========================================================
# Includes
# ==========================================================

include:

  - resources/pipelines/*.yml

  - resources/jobs/*.yml

  - resources/permissions/*.yml

  - resources/*/*.yml


# ==========================================================
# Python Artifact
# ==========================================================

artifacts:

  python_artifact:

    type: whl

    build: uv build --wheel


# ==========================================================
# Bundle Variables
# ==========================================================

variables:

  # --------------------------------------------------------
  # Unity Catalog
  # --------------------------------------------------------

  catalog:
    description: Unity Catalog name

  # --------------------------------------------------------
  # Schemas
  # --------------------------------------------------------

  bronze_schema:
    description: Bronze schema

  silver_schema:
    description: Silver schema

  gold_schema:
    description: Gold schema

  quarantine_schema:
    description: Quarantine schema

  monitoring_schema:
    description: Monitoring schema


# ==========================================================
# Targets
# ==========================================================

targets:


  # ========================================================
  # Leo Development
  # ========================================================

  dev-leo:

    default: true

    mode: development

    workspace:

      host: https://adb-7405611543404339.19.azuredatabricks.net

      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/

    variables:

      catalog: finance_catalog_leo

      bronze_schema: bronze

      silver_schema: silver

      gold_schema: gold

      quarantine_schema: quarantine

      monitoring_schema: monitoring


  # ========================================================
  # Aish Development
  # ========================================================

  dev-aish:

    mode: development

    workspace:

      host: https://adb-7405611543404339.19.azuredatabricks.net

      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/

    variables:

      catalog: finance_catalog_alj

      bronze_schema: bronze

      silver_schema: silver

      gold_schema: gold

      quarantine_schema: quarantine

      monitoring_schema: monitoring


  # ========================================================
  # Production
  # ========================================================

  prod:

    mode: production

    workspace:

      host: https://adb-7405611543404339.19.azuredatabricks.net

      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/

    variables:

      catalog: finance_catalog

      bronze_schema: bronze

      silver_schema: silver

      gold_schema: gold

      quarantine_schema: quarantine

      monitoring_schema: monitoring

    # ------------------------------------------------------
    # Production Pipeline Overrides
    # ------------------------------------------------------
    #
    # The shared pipeline YAML files use:
    #
    #     development: true
    #
    # Development targets keep that setting.
    #
    # Production overrides it to false.
    # ------------------------------------------------------

    resources:

      pipelines:

        account_pipeline:

          development: false


        atm_transaction_pipeline:

          development: false


        branch_pipeline:

          development: false


        card_pipeline:

          development: false


        customer_pipeline:

          development: false


        customer_kyc_pipeline:

          development: false


        exchange_rate_pipeline:

          development: false


        loan_pipeline:

          development: false


        login_activity_pipeline:

          development: false


        transaction_pipeline:

          development: false