# This is a Declarative Automation Bundle definition for finance_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: finance_bundle
  uuid: d5562624-9fe4-4095-894f-388b3abd0f3e

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405606250328066.6.azuredatabricks.net
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405606250328066.6.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/lakshmanan.p@diggibyte.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lakshmanan.p@diggibyte.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: lakshmanan.p@diggibyte.com
        level: CAN_MANAGE
