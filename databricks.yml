bundle:
  name: enterprise-banking-platform
  uuid: d5562624-9fe4-4095-894f-388b3abd0f3e

include:
  - resources/pipelines/*.yml
  - resources/jobs/*.yml
  - resources/permissions/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog name

  bronze_schema:
    description: Bronze schema

  silver_schema:
    description: Silver schema

  gold_schema:
    description: Gold schema

  monitoring_schema:
    description: Monitoring schema

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://adb-7405606250328066.6.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: finance-catalog
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      monitoring_schema: monitoring

  prod:
    mode: production

    workspace:
      host: https://adb-7405606250328066.6.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: finance-catalog
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      monitoring_schema: monitoring