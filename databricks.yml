bundle:
  name: finance_bundle
  uuid: e8599de7-e987-40c2-a71a-d83a9c59d3a7

include:
  - resources/pipelines/*.yml
  - resources/jobs/*.yml
  - resources/permissions/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog name

  bronze_schema:
    description: Bronze schema

  silver_schema:
    description: Silver schema

  gold_schema:
    description: Gold schema

  monitoring_schema:
    description: Monitoring schema

targets:
  dev-leo:
    default: true
    mode: development

    workspace:
      host: https://adb-7405611543404339.19.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/

    variables:
      catalog: finance_catalog_leo
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      monitoring_schema: monitoring
  
  dev-aish:

    mode: development

    workspace:

      host: https://adb-7405611543404339.19.azuredatabricks.net

      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/

    variables:

      catalog: finance_catalog_alj

      bronze_schema: bronze

      silver_schema: silver

      gold_schema: gold

      monitoring_schema: monitoring

  prod:
    mode: production

    workspace:
      host: https://adb-7405611543404339.19.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/

    variables:
      catalog: finance_catalog
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      monitoring_schema: monitoring