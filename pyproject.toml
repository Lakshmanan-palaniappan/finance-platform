[project]
name = "finance_bundle"
version = "0.0.2"

authors = [
    { name = "lakshmanan.p@diggibyte.com" }
]

requires-python = ">=3.10,<3.13"

dependencies = [
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.hatch.build.targets.wheel]
packages = ["src/finance_bundle"]