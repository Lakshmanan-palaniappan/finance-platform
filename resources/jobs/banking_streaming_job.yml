resources:

  jobs:

    banking_streaming_job:

      name: finance-banking-streaming-job

      schedule:
        quartz_cron_expression: "0 */5 * * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      tasks:

        - task_key: transaction_pipeline

          pipeline_task:
            pipeline_id: ${resources.pipelines.transaction_pipeline.id}


        - task_key: atm_transaction_pipeline

          pipeline_task:
            pipeline_id: ${resources.pipelines.atm_transaction_pipeline.id}


        - task_key: login_activity_pipeline

          pipeline_task:
            pipeline_id: ${resources.pipelines.login_activity_pipeline.id}