resources:

  jobs:

    reference_data_job:

      name: finance-reference-data-job

      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: PAUSED

      max_concurrent_runs: 1

      tasks:

        - task_key: branch_pipeline

          pipeline_task:
            pipeline_id: ${resources.pipelines.branch_pipeline.id}


        - task_key: exchange_rate_pipeline

          pipeline_task:
            pipeline_id: ${resources.pipelines.exchange_rate_pipeline.id}