resources:

  pipelines:

    branch_pipeline:

      name: branch-end-to-end-pipeline

      catalog: ${var.catalog}

      target: ${var.silver_schema}

      serverless: true

      development: true

      channel: CURRENT

      libraries:

        # --------------------------------------------------
        # Bronze
        # --------------------------------------------------

        - file:
            path: ../../src/finance_bundle/bronze/branch/branch_pipeline.py

        # --------------------------------------------------
        # Silver
        # --------------------------------------------------

        - file:
            path: ../../src/finance_bundle/silver/branch/branch_pipeline.py

        # --------------------------------------------------
        # Gold
        # --------------------------------------------------

        - file:
            path: ../../src/finance_bundle/gold/branch/branch_pipeline.py

      environment:

        dependencies:

          - ${workspace.artifact_path}/.internal/finance_bundle-0.0.9-py3-none-any.whl