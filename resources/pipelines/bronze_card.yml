resources:
  pipelines:
    bronze_card:
      name: bronze-card-pipeline

      catalog: ${var.catalog}
      target: ${var.bronze_schema}

      serverless: true
      development: true
      channel: CURRENT

      libraries:
        - file:
            path: ../../src/finance_bundle/bronze/card/card_pipeline.py

      environment:
        dependencies:
          - ${workspace.artifact_path}/.internal/finance_bundle-0.0.2-py3-none-any.whl