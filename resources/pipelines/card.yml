resources:
  pipelines:

    card_pipeline:

      name: card-end-to-end-pipeline

      catalog: ${var.catalog}

      target: ${var.silver_schema}

      serverless: true

      development: true

      channel: CURRENT

      libraries:

        - file:
            path: ../../src/finance_bundle/bronze/card/card_pipeline.py

        - file:
            path: ../../src/finance_bundle/silver/card/card_pipeline.py

        - file:
            path: ../../src/finance_bundle/gold/card/card_pipeline.py

      environment:

        dependencies:
          - ${workspace.artifact_path}/.internal/finance_bundle-0.0.8-py3-none-any.whl