resources:
  pipelines:

    customer_pipeline:

      name: customer-end-to-end-pipeline

      catalog: ${var.catalog}

      target: ${var.silver_schema}

      serverless: true

      development: true

      channel: CURRENT

      libraries:

        - file:
            path: ../../src/finance_bundle/bronze/customer/customer_pipeline.py

        - file:
            path: ../../src/finance_bundle/silver/customer/customer_pipeline.py

        - file:
            path: ../../src/finance_bundle/gold/customer360/customer360_pipeline.py

      environment:

        dependencies:
          - ${workspace.artifact_path}/.internal/finance_bundle-0.0.9-py3-none-any.whl